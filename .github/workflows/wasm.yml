# The WebAssembly artifact the tutorial's demos run on: built as it ships and
# without exception catching, both sizes reported, the shipped one held to its
# budget, loaded in Node — the site's Node — and held to the fixtures, then
# uploaded. Called by ci.yml on every push and by release.yml on a version tag,
# so a release attaches exactly what this tested.

name: wasm

on:
  workflow_call:

permissions:
  contents: read

env:
  # One exact Emscripten release, from the first-party emsdk repository.
  EMSDK_VERSION: "6.0.13"

jobs:
  wasm:
    name: build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Emscripten
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build, both ways, and check the size
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          wasm/build.sh

      - name: Smoke test
        run: node --test wasm/smoke.test.mjs

      # What a release attaches — the module, its .wasm, the size report and
      # their checksums — and the notes it is published with, in one flat
      # directory. The release job reads these paths and no others.
      - name: Assemble the release's files
        run: |
          mkdir dist
          cp build-wasm/wasm/touchstone.mjs build-wasm/wasm/touchstone.wasm build-wasm/size.txt dist/
          (cd dist && sha256sum touchstone.mjs touchstone.wasm > SHA256SUMS)
          {
            echo "The WebAssembly build of Touchstone at $GITHUB_SHA."
            echo
            echo '`touchstone.mjs` is an ES module whose default export, `createTouchstone()`,'
            echo 'resolves to the module; it loads `touchstone.wasm` from beside itself.'
            echo 'What the module carries, and how it reports a refused input, is written at'
            echo 'the top of `wasm/binding.cpp`.'
            echo
            echo '```'
            cat dist/size.txt
            echo '```'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > dist/notes.md
          ls -l dist

      # A single directory is uploaded as its contents, so the artifact is flat.
      - uses: actions/upload-artifact@v7
        with:
          name: touchstone-wasm
          path: dist/
          if-no-files-found: error

  # The release job's download, done on every push: the artifact fetched as it
  # fetches it, into the directory it reads, and every file it attaches found
  # there and checked against its sum.
  downloaded:
    name: the release's files, downloaded
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: touchstone-wasm
          path: dist

      - name: Every file the release attaches, where it reads it
        run: |
          ls -l dist
          for file in touchstone.mjs touchstone.wasm size.txt SHA256SUMS notes.md; do
            test -f "dist/$file" || { echo "dist/$file is missing" >&2; exit 1; }
          done
          (cd dist && sha256sum --check --strict SHA256SUMS)
