# A release, from a version tag: the WebAssembly artifact built from the tagged
# commit and smoke-tested by wasm.yml, then attached, as tested, to a GitHub
# release of the same name. The tutorial vendors a pinned release
# (tech-decision B4), so what is attached here is exactly what a demo runs on.
#
# Nothing here pushes a tag. The owner tags a merged commit; this runs on that.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  wasm:
    uses: ./.github/workflows/wasm.yml

  release:
    name: release
    needs: wasm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # The smoke test has already held the module's version to CMakeLists.txt's;
      # this holds the tag to it.
      - name: The tag names the project's version
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME, but CMakeLists.txt says $version." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          name: touchstone-wasm
          path: dist

      - name: Checksums and notes
        run: |
          (cd dist && sha256sum touchstone.mjs touchstone.wasm > SHA256SUMS)
          {
            echo "The WebAssembly build of Touchstone at $GITHUB_REF_NAME ($GITHUB_SHA)."
            echo
            echo '`touchstone.mjs` is an ES module whose default export, `createTouchstone()`,'
            echo 'resolves to the module; it loads `touchstone.wasm` from beside itself.'
            echo 'What the module carries, and how it reports a refused input, is written at'
            echo 'the top of `wasm/binding.cpp`.'
            echo
            echo '```'
            cat dist/size.txt
            echo '```'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/touchstone.mjs dist/touchstone.wasm dist/size.txt dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Touchstone $GITHUB_REF_NAME"
          --notes-file notes.md
